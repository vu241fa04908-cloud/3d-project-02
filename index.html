
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traditional 3D Bedroom Designer</title>

    <link rel="stylesheet" href="style.css">

    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
    </script>
</head>

<body>

<header>
    <h1>Heritage Haven</h1>
    <p>AI Based Traditional 3D Bedroom Designer</p>
</header>

<div class="layout">

    <aside>
        <h2>Room Customization</h2>

        <label>Wall Colour</label>
        <input type="color" id="wallColor" value="#e8d8bd">

        <label>Floor Colour</label>
        <input type="color" id="floorColor" value="#80502f">

        <h3>Furniture</h3>

        <label><input type="checkbox" id="bed" checked> Bed</label>
        <label><input type="checkbox" id="wardrobe" checked> Wardrobe</label>
        <label><input type="checkbox" id="table" checked> Bedside Table</label>
        <label><input type="checkbox" id="decor" checked> Decorations</label>

        <h3>Save Design</h3>

        <input type="text" id="designName"
               placeholder="Enter design name">

        <button onclick="saveDesign()">Save Design</button>

        <h3>Saved Designs</h3>
        <button onclick="loadDesigns()">View Designs</button>

        <div id="designList"></div>
    </aside>

    <main>
        <h2>Realistic Traditional Bedroom</h2>
        <div id="room"></div>
        <p>Drag to rotate | Scroll to zoom</p>
    </main>

</div>

<script type="module" src="app.js"></script>
</body>
</html>
